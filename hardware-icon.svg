<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1d1114"/>
      <stop offset="65%" stop-color="#0c0a0c"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="redCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="55%" stop-color="#e11d2e"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff7875"/>
      <stop offset="45%" stop-color="#ff2a2a"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="redGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深黑磨砂圆角基板 -->
  <rect x="4" y="4" width="248" height="248" rx="54" fill="url(#bgGrad)" stroke="#7f1d1d" stroke-width="3"/>
  <rect x="14" y="14" width="228" height="228" rx="45" stroke="rgba(255,42,42,0.18)" stroke-width="1.5"/>

  <!-- 12 路 45° PCB 红色铜箔走线 -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 顶部 3 路 -->
    <path d="M104 82 V52 L84 32"/>
    <path d="M128 82 V32"/>
    <path d="M152 82 V52 L172 32"/>
    <!-- 底部 3 路 -->
    <path d="M104 174 V204 L84 224"/>
    <path d="M128 174 V224"/>
    <path d="M152 174 V204 L172 224"/>
    <!-- 左侧 3 路 -->
    <path d="M82 104 H52 L32 84"/>
    <path d="M82 128 H32"/>
    <path d="M82 152 H52 L32 172"/>
    <!-- 右侧 3 路 -->
    <path d="M174 104 H204 L224 84"/>
    <path d="M174 128 H224"/>
    <path d="M174 152 H204 L224 172"/>
  </g>

  <!-- PCB 过孔焊盘 (Vias) -->
  <g fill="#09090b" stroke="#ff3b30" stroke-width="4">
    <circle cx="84" cy="32" r="6.5"/>
    <circle cx="128" cy="32" r="6.5"/>
    <circle cx="172" cy="32" r="6.5"/>
    <circle cx="84" cy="224" r="6.5"/>
    <circle cx="128" cy="224" r="6.5"/>
    <circle cx="172" cy="224" r="6.5"/>
    <circle cx="32" cy="84" r="6.5"/>
    <circle cx="32" cy="128" r="6.5"/>
    <circle cx="32" cy="172" r="6.5"/>
    <circle cx="224" cy="84" r="6.5"/>
    <circle cx="224" cy="128" r="6.5"/>
    <circle cx="224" cy="172" r="6.5"/>
  </g>

  <!-- 芯片引脚高光底座 -->
  <g stroke="#ff5252" stroke-width="6" stroke-linecap="round">
    <line x1="104" y1="73" x2="104" y2="82"/>
    <line x1="128" y1="73" x2="128" y2="82"/>
    <line x1="152" y1="73" x2="152" y2="82"/>
    <line x1="104" y1="174" x2="104" y2="183"/>
    <line x1="128" y1="174" x2="128" y2="183"/>
    <line x1="152" y1="174" x2="152" y2="183"/>
    <line x1="73" y1="104" x2="82" y2="104"/>
    <line x1="73" y1="128" x2="82" y2="128"/>
    <line x1="73" y1="152" x2="82" y2="152"/>
    <line x1="174" y1="104" x2="183" y2="104"/>
    <line x1="174" y1="128" x2="183" y2="128"/>
    <line x1="174" y1="152" x2="183" y2="152"/>
  </g>

  <!-- 中央 IC 芯片黑红封装 -->
  <rect x="82" y="82" width="92" height="92" rx="14" fill="#0d0d10" stroke="url(#redCore)" stroke-width="4.5"/>
  <rect x="90" y="90" width="76" height="76" rx="9" fill="#140c0e" stroke="rgba(255,59,48,0.28)" stroke-width="1.5"/>

  <!-- IC 一号引脚定位点 -->
  <circle cx="99" cy="99" r="3.5" fill="#ff3b30"/>

  <!-- 发光电流闪电核心 -->
  <path d="M137 96 L108 132 H127 L119 160 L148 124 H129 Z" fill="url(#boltGrad)" filter="url(#redGlow)"/>
</svg>
